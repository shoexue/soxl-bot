name: Deploy SOXL Dashboard to Cloudflare Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Daily SOXL Paper Bot
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "data/**"
      - "frontend/**"
      - "reports/export_dashboard_json.py"
      - "requirements.txt"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  deployments: write

concurrency:
  group: soxl-dashboard-cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Export static dashboard data
        run: python3 reports/export_dashboard_json.py
        env:
          PAPER_BOT_RUN_ID: ${{ github.event.workflow_run.id }}
          PAPER_BOT_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          PAPER_BOT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PAPER_BOT_RUN_STATUS: ${{ github.event.workflow_run.status }}
          PAPER_BOT_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PAPER_BOT_RUN_EVENT: ${{ github.event.workflow_run.event }}
          PAPER_BOT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PAPER_BOT_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          PAPER_BOT_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
          PAPER_BOT_HTML_URL: ${{ github.event.workflow_run.html_url }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend for Cloudflare Pages
        run: npm run build
        working-directory: frontend
        env:
          VITE_LIVE_API_BASE_URL: https://soxl-live-api.justinxue2005.workers.dev

      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=soxl-live-dashboard --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
