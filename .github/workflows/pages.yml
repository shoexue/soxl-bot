name: Deploy SOXL Dashboard Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Daily SOXL Paper Bot
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "data/**"
      - "frontend/**"
      - "reports/export_dashboard_json.py"
      - "requirements.txt"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: soxl-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Export static dashboard data
        run: python3 reports/export_dashboard_json.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend for GitHub Pages
        run: npm run build
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
